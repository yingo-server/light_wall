name: light_wall
description: "LightWall 光墙 —— Windows 物理光照壁纸引擎：每 3 分钟重打一次窗光并设为壁纸"
publish_to: none
version: 1.2.2+1220

environment:
  sdk: ^3.9.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  lightwall_core:
    path: ../packages/lightwall_core
  ffi: ^2.1.0
  window_manager: ^0.5.0
  tray_manager: ^0.5.0
  file_selector: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/backgrounds/
    - assets/icon/
