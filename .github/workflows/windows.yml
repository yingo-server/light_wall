name: Windows

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
    inputs:
      shot_pages:
        description: '要截图的界面（逗号分隔：home,text,bg,settings）'
        default: 'home,text,bg,settings'
      release:
        description: '是否发布 Release'
        default: 'false'
      tag:
        description: 'Release 版本号（如 v1.1.0）'
        default: 'v1.1.0'

permissions:
  contents: write

concurrency:
  group: win-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  build:
    name: 构建 Windows + UI 截图
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Flutter 版本
        run: flutter --version

      - name: 拉取依赖
        working-directory: app
        run: flutter pub get

      - name: 静态检查
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: 单元测试
        working-directory: app
        run: |
          # PowerShell 的 || 不会重置 $LASTEXITCODE：测试目录不存在时
          # flutter 以 1 退出，echo 虽执行但步骤仍以 1 收尾 → 假红。
          if (Test-Path test) {
            flutter test --no-pub
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "（暂无 app 侧测试，跳过）"
          }
          exit 0

      - name: 构建 Windows（Release）
        working-directory: app
        run: flutter build windows --release

      # 纯 Dart 渲染 CLI：零 Flutter / 零 GPU 依赖，AOT 编译成独立 exe。
      # 意义：app 的 --render 路径仍要经过 Flutter 引擎（窗口 + 光栅化器），
      # 而 Flutter 没有"GPU 不可用就自动退到 CPU"的保证机制；一旦图形环境
      # 不可用（远程会话 / 无显卡虚拟机 / 驱动异常），连出图都会失败。
      # 这个 CLI 只链接 Dart runtime，任何环境都能跑。
      - name: 构建纯 Dart 渲染 CLI（无 Flutter/GPU 依赖）
        working-directory: packages/lightwall_core
        run: |
          $dart = "$env:FLUTTER_ROOT\bin\dart.exe"
          if (-not (Test-Path $dart)) { $dart = "dart" }
          & $dart pub get
          & $dart compile exe bin/render.dart -o "$env:GITHUB_WORKSPACE\lightwall_render.exe"
          & "$env:GITHUB_WORKSPACE\lightwall_render.exe" --help | Select-Object -First 3
          Write-Host "CLI 大小: $([math]::Round((Get-Item "$env:GITHUB_WORKSPACE\lightwall_render.exe").Length/1MB,1)) MB"

      # 冒烟：核心渲染内核（纯 Dart，不碰 GUI/Flutter 引擎）
      # 不用 light_wall.exe：它是 GUI 子系统程序，在无头 runner 上
      # 渲染完成后 Flutter 引擎的消息循环不退出，Start-Process -Wait
      # 会永远挂住（实测 >16 min）。核心包是纯 Dart，AOT 跑得通。
      - name: 冒烟：核心渲染内核
        working-directory: packages/lightwall_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart format --output=none --set-exit-if-changed .
          dart test
          dart run tools/light_diag.dart
          dart run bin/render.dart --bg ../../app/assets/backgrounds/microcement.png `
            --time 2025-12-21T08:30:00+08:00 --lat 39.9042 --lon 116.4074 `
            --window east --width 640 --height 360 --out "${{ env.GITHUB_WORKSPACE }}\core_smoke.png"
          if (-not (Test-Path "${{ env.GITHUB_WORKSPACE }}\core_smoke.png")) {
            Write-Host "核心渲染未产出"; exit 1
          }
          Write-Host "核心渲染 OK ($((Get-Item "${{ env.GITHUB_WORKSPACE }}\core_smoke.png").Length) 字节)"

      - name: 冒烟：应用命令行渲染（带超时）
        working-directory: app
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'smoke.png'
          $exe = ".\build\windows\x64\runner\Release\light_wall.exe"
          # GUI 子系统程序在无头 runner 上不保证自己退出 → 用 Wait-Process -Timeout
          # 兜底，超时就当"环境不支持"（核心渲染已由上一步覆盖）。
          $proc = Start-Process -FilePath $exe -ArgumentList @('--render','--out',$out) -PassThru -NoNewWindow
          try {
            Wait-Process -Id $proc.Id -Timeout 180 -ErrorAction Stop
          } catch {
            Write-Host "（应用渲染在无头环境超时，已由核心渲染冒烟覆盖）"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            exit 0
          }
          if (Test-Path $out) { Write-Host "命令行渲染 OK ($((Get-Item $out).Length) 字节)" }
          else { Write-Host "命令行渲染未产出（不阻塞）" }

      - name: UI 截图（供回归对比）
        working-directory: app
        run: |
          $exe = ".\build\windows\x64\runner\Release\light_wall.exe"
          $pages = "${{ github.event.inputs.shot_pages || 'home,text,bg,settings' }}".Split(',')
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'shots') | Out-Null
          foreach ($p in $pages) {
            $p = $p.Trim()
            if (-not $p) { continue }
            $shot = Join-Path $env:GITHUB_WORKSPACE "shots\ui_$p.png"
            Write-Host "截图: $p"
            $proc = Start-Process -FilePath $exe -ArgumentList @('--shot',$shot,'--ui-page',$p) -PassThru -NoNewWindow
            # --shot 内部会 exit(0)，是真正会自己结束的路径，给足 240s
            try {
              Wait-Process -Id $proc.Id -Timeout 240 -ErrorAction Stop
            } catch {
              Write-Host "  → 超时"
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path $shot) {
              Write-Host "  → $((Get-Item $shot).Length) 字节"
            } else {
              Write-Host "  → 未产出（跳过，不阻塞）"
            }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build
          path: app/build/windows/x64/runner/Release/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: |
            shots/
            smoke.png
            core_smoke.png
          retention-days: 30
          if-no-files-found: warn

      - name: 打包 ZIP
        run: |
          # 把纯 Dart 渲染 CLI 一并放进发布目录（无 GPU 环境的兜底出图工具）
          Copy-Item "$env:GITHUB_WORKSPACE\lightwall_render.exe" `
            -Destination "app\build\windows\x64\runner\Release\" -Force
          Compress-Archive -Path app/build/windows/x64/runner/Release -DestinationPath LightWall-windows-x64.zip
          $sz = (Get-Item LightWall-windows-x64.zip).Length
          Write-Host "ZIP 大小: $([math]::Round($sz/1MB,1)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: light-wall-windows
          path: LightWall-windows-x64.zip
          retention-days: 90

      - name: 发布 Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # 版本号由 dispatch 输入决定（默认 v1.1.0）—— 此前写死 v1.0.0，
          # 发第二个版本会静默覆盖旧 Tag，是危险的默认值。
          tag_name: ${{ github.event.inputs.tag || 'v1.1.0' }}
          name: LightWall ${{ github.event.inputs.tag || 'v1.1.0' }}
          prerelease: false
          files: LightWall-windows-x64.zip
          body_path: release_notes.md
          fail_on_unmatched_files: false
          overwrite_files: false
          draft: false